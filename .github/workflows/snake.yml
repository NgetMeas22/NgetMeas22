name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches:
      - main

# Avoid overlapping runs pushing to the output branch at the same time
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build contribution snake
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#db2777&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#db2777&color_dots=#161b22,#3e1c5c,#5c298a,#873ebd,#b65fe6

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

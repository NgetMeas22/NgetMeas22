# Save as: .github/workflows/snake.yml  (in the NgetMeas22/NgetMeas22 profile repo)
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]

# Prevent overlapping runs from pushing to the output branch at the same time
concurrency:
  group: snake
  cancel-in-progress: true

permissions:
  contents: write # needed to push to the "output" branch

jobs:
  generate:
    name: Build contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#db2777&color_dots=#ebedf0,#c7e8fb,#8fd3f7,#36bcf7,#0e75b6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#db2777&color_dots=#161b22,#0c2d48,#0e4a73,#0e75b6,#36bcf7

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
